{% extends "layout.html" %}
{% block content %}

<div class="container mt-4">
    <h2 class="mb-4">내 일정 전체 보기</h2>

    {% if schedules %}
        {% for s in schedules %}
            <div class="card mb-3" style="border-left: 8px solid {{ s.color }};">
                <div class="card-body">
                    <h5 class="card-title">{{ s.title }}</h5>
                    <h6 class="card-subtitle text-muted">
                        {{ s.date.strftime("%Y-%m-%d") }}
                    </h6>

                    {% if s.memo %}
                        <p class="card-text mt-2">{{ s.memo }}</p>
                    {% endif %}

                    <a href="{{ url_for('schedule_detail', schedule_id=s.id) }}"
                        class="btn btn-primary btn-sm mt-2">
                        상세보기
                    </a>

                </div>
            </div>
        {% endfor %}
    {% else %}
        <p>등록된 일정이 없습니다.</p>
    {% endif %}
</div>

{% endblock %}
