{% extends "layout.html" %}
{% block content %}

<div class="container mt-4">

    <!-- 제목 + 뒤로가기 -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="mb-0">📅 {{ date }} 일정</h2>

        <a href="{{ url_for('home') }}" class="btn btn-outline-secondary btn-sm">
            ← 메인으로
        </a>
    </div>

    <!-- 일정이 없을 때 표시 -->
    {% if schedules|length == 0 %}
        <div class="alert alert-info text-center">
            <strong>{{ date }}</strong> 에 등록된 일정이 없습니다.<br>
            아래 버튼을 눌러 새 일정을 추가해보세요.
        </div>
    {% endif %}

    <!-- 일정 카드 리스트 -->
    <div class="vstack gap-3">

        {% for s in schedules %}
        <div class="card shadow-sm">
            <div class="card-body d-flex justify-content-between align-items-center">

                <!-- 일정 정보 -->
                <div>
                    <h5 class="mb-1">{{ s.title }}</h5>
                    <div class="text-muted small">ID: {{ s.id }}</div>
                </div>

                <!-- 삭제 버튼 -->
                <form action="{{ url_for('delete_schedule', schedule_id=s.id) }}"
                      method="POST"
                      onsubmit="return confirm('정말 삭제할까요?');">
                    <button type="submit" class="btn btn-sm btn-danger">
                        삭제
                    </button>
                </form>

            </div>
        </div>
        {% endfor %}

    </div>

    <!-- 일정 추가 버튼 -->
    <div class="text-center mt-4">
        <a href="{{ url_for('new_schedule') }}?date={{ date }}"
           class="btn btn-primary btn-lg px-4">
            + 새 일정 추가
        </a>
    </div>

</div>

{% endblock %}
