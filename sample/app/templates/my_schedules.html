{% extends "layout.html" %}
{% block content %}

<h2>내 일정</h2>

{% if schedules %}
    {% for s in schedules %}
        <div class="schedule-card">
            <h4>{{ s.title }}</h4>
            <p><strong>날짜:</strong> {{ s.date }}</p>
            <p><strong>내용:</strong> {{ s.content }}</p>

            <a href="{{ url_for('schedule_detail', schedule_id=s.id) }}" class="btn btn-primary">상세보기</a>

            <form action="{{ url_for('delete_schedule', schedule_id=s.id) }}"
                  method="POST"
                  style="display:inline;"
                  onsubmit="return confirm('정말 삭제할까요?');">
                <button type="submit" class="btn btn-danger btn-sm">삭제</button>
            </form>
        </div>
    {% endfor %}
{% else %}
    <p>등록된 일정이 없습니다.</p>
{% endif %}

<style>
.schedule-card {
    border: 1px solid #ddd;
    padding: 15px;
    border-radius: 10px;
    margin-bottom: 15px;
}
</style>

{% endblock %}
