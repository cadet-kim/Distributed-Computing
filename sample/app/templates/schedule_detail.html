{{% extends "layout.html" %}
{% block content %}

<div class="container mt-4">
    <h2>{{ schedule.title }}</h2>

    <p class="text-muted">
        <strong>날짜:</strong> {{ schedule.date.strftime("%Y-%m-%d") }}
    </p>

    {% if schedule.memo %}
        <p><strong>메모:</strong><br>{{ schedule.memo }}</p>
    {% endif %}

    <div class="mt-4 d-flex gap-2">
        <!-- 수정 버튼 -->
        <a href="{{ url_for('edit_schedule', schedule_id=schedule.id) }}" class="btn btn-warning">
            <i class="fa-solid fa-pen-to-square"></i> 수정
        </a>

        <!-- 삭제 버튼 -->
        <form action="{{ url_for('delete_schedule', schedule_id=schedule.id) }}"
              method="POST"
              onsubmit="return confirm('정말 삭제할까요?');">
            <button type="submit" class="btn btn-danger">
                <i class="fa-solid fa-trash"></i> 삭제
            </button>
        </form>

        <!-- 전체 일정 페이지로 이동 -->
        <a href="{{ url_for('total_schedules') }}" class="btn btn-secondary ms-2">
            전체 일정 보기
        </a>
    </div>
</div>

{% endblock %}
