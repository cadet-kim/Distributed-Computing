<link rel="stylesheet" href="{{ url_for('static', filename='static/smallcalendar.css') }}">

<div class="wrapper">
    <div class="nav">
        <button id="prev" class="material-icons">chevron_left</button>
        <p class="current-date"></p>
        <button id="next" class="material-icons">chevron_right</button>
    </div>

    <div class="calendar">
        <ul class="weeks">
            <li>Sun</li><li>Mon</li><li>Tue</li><li>Wed</li>
            <li>Thu</li><li>Fri</li><li>Sat</li>
        </ul>
        <ul class="days"></ul>
    </div>
</div>

<!-- JS 불러오기 -->
<script src="{{ url_for('static', filename='static/js/smallcalendar.js') }}"></script>
