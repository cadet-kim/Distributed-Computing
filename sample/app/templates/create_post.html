{% extends "layout.html" %}
{% block content %}

<div class="container mt-4">
    <h2 class="mb-4">글쓰기</h2>

    <form method="POST">
        {{ form.hidden_tag() }}

        <!-- 제목 -->
        <div class="mb-3">
            <label class="form-label fw-semibold">제목</label>
            {{ form.title(class="form-control") }}
        </div>

        <!-- 내용 — 기본 템플릿 자동 입력 -->
        <div class="mb-3">
            <label class="form-label fw-semibold">내용</label>
            <textarea name="content" class="form-control" rows="12">
【요청 내용】
- 

【가능한 시간】
- 

【현재 상태】
- 

【기타】
- 
            </textarea>
        </div>

        <!-- 등록 버튼 -->
        <button type="submit" class="btn btn-primary">등록</button>
    </form>
</div>

{% endblock %}
